title: Carbon Aware Thermostat
views:
  - title: Overview
    path: overview
    icon: mdi:leaf
    cards:

      - type: history-graph
        title: Carbon Intensity vs Temperature
        hours_to_show: 24
        refresh_interval: 30
        entities:
          - entity: sensor.estimated_carbon_intensity
            name: Estimated carbon intensity
          - entity: sensor.indoor_temperature
            name: Indoor temperature
          - entity: sensor.recommended_setpoint
            name: Recommended setpoint

      - type: history-graph
        title: Thermostat Behaviour
        hours_to_show: 24
        refresh_interval: 30
        entities:
          - entity: sensor.recommended_heating_power
            name: Heating power recommendation

      - type: entities
        title: Current Values
        entities:
          - sensor.indoor_temperature
          - sensor.demo_indoor_temperature
          - sensor.estimated_carbon_intensity
          - sensor.recommended_setpoint
          - sensor.recommended_heating_power
